<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#A96BFB" />
    <title>Sem ligação | AQUA AI Tools</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 80% 15%, #ad64ef 0, #43204f 34%, #11131a 72%); color: #fff; }
      main { width: min(100%, 560px); padding: clamp(28px, 7vw, 56px); border: 1px solid rgb(255 255 255 / 18%); border-radius: 32px; background: rgb(16 18 26 / 88%); box-shadow: 0 28px 80px rgb(0 0 0 / 35%); text-align: center; }
      .icon { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 18px 38px rgb(0 0 0 / 35%); }
      .signature { display: block; width: min(100%, 320px); margin: 24px auto 8px; }
      h1 { margin: 28px 0 12px; font-size: clamp(1.8rem, 6vw, 2.6rem); }
      p { margin: 0 auto 28px; max-width: 42ch; color: #d9dce7; line-height: 1.6; }
      button { border: 0; border-radius: 999px; padding: 13px 22px; font: inherit; font-weight: 750; color: #22102f; background: #fff; cursor: pointer; }
      button:focus-visible { outline: 3px solid #cf9cff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img class="icon" src="/aqua-brand/app-icon.png" alt="" width="96" height="96" />
      <img class="signature" src="/aqua-brand/lockup-white.svg" alt="ONDA + AQUA + AI TOOLS" />
      <h1>Sem ligação à Internet</h1>
      <p>A aplicação está instalada. Volta a tentar quando a ligação estiver disponível.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
