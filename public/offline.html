<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1530" />
    <title>Sem ligação | AQUA AI Tools</title>
    <style>
      :root { font-family: system-ui, -apple-system, sans-serif; color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0b1530; color: #fff; }
      main { width: min(100%, 520px); padding: clamp(28px, 7vw, 48px); border: 1px solid #a96bfb66; border-radius: 28px; background: #17213d; text-align: center; }
      img { width: 88px; height: 88px; border-radius: 20px; }
      h1 { margin: 24px 0 12px; font-size: clamp(1.8rem, 6vw, 2.5rem); }
      p { margin: 0 auto 28px; max-width: 38ch; line-height: 1.6; color: #dbe1f3; }
      button { padding: 12px 22px; border: 0; border-radius: 999px; background: #a96bfb; color: #111528; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    </style>
  </head>
  <body data-aqua-offline="1">
    <main>
      <img src="/icons/icon-192.png" alt="" width="88" height="88" />
      <h1>Sem ligação à Internet</h1>
      <p>O diretório precisa de ligação para carregar ferramentas. Volta a tentar quando estiveres online.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
